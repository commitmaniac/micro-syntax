filetype: mdoc

detect:
  filename: "\\.[1-9]$"
  header: "\\.\\\\\""

rules:
  - identifier: "^\\.[A-Z][a-z]"
  - identifier:
      start: "^\\.(Sh|Dt)"
      end: "$"
      rules:
        - preproc: "[[:space:]]([A-Z]+)"
        - constant.number: "[1-8]"
  - preproc: "\\b(Fl|Ar)\\b"
  - constant.string:
      start: "\""
      end: "\""
      rules:
        - constant.specialChar: "\\\\."
  - comment.line:
      start: "^\\.\\\\\""
      end: "$"
      rules: []
